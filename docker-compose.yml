services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nexushire_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./data/nexushire.db
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    volumes:
      - ./backend/data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nexushire_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
